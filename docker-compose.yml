version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docops_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-docops_agent}
    ports:
      - "5432:5432"
    volumes:
      - docops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docops -d docops_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: docops_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  docops_postgres_data:
  docops_redis_data:
