name: Docker - Build & Push

on:
  workflow_run:
    workflows: ["CI - Continuous Integration"]
    types:
      - completed
    branches:
      - main
      - develop
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag manual customizada (opcional)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write
  security-events: write

env:
  # Registry padrão: GitHub Container Registry (ghcr.io). Pode ser substituído por Docker Hub ou AWS ECR.
  DEFAULT_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build-push:
    name: 🐳 Docker Buildx, Scan & Push
    runs-on: ubuntu-latest
    # Executa se for disparado manualmente, por push de tag, ou se o workflow de CI completou com SUCESSO
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login no Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY || env.DEFAULT_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extrair Metadados e Tags da Imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY || env.DEFAULT_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: 🔨 Build e Push da Imagem com Cache de Layers (GHA)
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Escaneamento de Vulnerabilidades da Imagem Docker (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: 📋 Resumo do Build
        run: |
          echo "### 🚀 Imagem Docker gerada e publicada com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`${{ secrets.DOCKER_REGISTRY || env.DEFAULT_REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ steps.build-and-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
